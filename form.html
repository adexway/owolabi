<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="export.html" target="_blank">
        <label for="fname">firstname</label>
        <input type="text" name="firstname" id="firstname"><br><br>
        <label for="lname">lastname:</label>
        <input type="text" name="lastname" id="lastname"><br><br>
        <label for="email">email</label>
        <input type="text" name="email" id="email" required placeholder="email"><br><br>
        <label for="password">password</label>
        <input type="password" name="password" id="password" maxlength="4"><br><br>
        <label for="course">what course are you learning currently</label><br>
        <input type="radio" name="course" id="course">HTML <br>
        <input type="radio" name="course" id="course">css <br>
        <input type="radio" name="course" id="course">JAVASCRIPT <br><br>
        <input type="submit" name="submit" id="submit"><br><br>
        <label for="terms">do you agree with the terms and condition</label>
        <input type="checkbox" name="terms" id="terms">yes
        <input type="checkbox" name="terms" id="terms">no
    </form><br><br>


<form action="">
    <fieldset>
        <legend>personal information</legend>
    <label for="gender">Gender</label>
    <select name="gender" id="gender">
        <option value=""></option>
        <option value="male">male</option>
        <option value="female">female</option>
        <option value="other">other</option>
    </select>
    <input list="browser">
    <datalist id="browser">
        <option value=""></option>
        <option value="chrome">chrome</option>
        <option value="firefox">firefox</option>
        <option value="safari">safari</option>
    </datalist>
    <textarea name="message" id="message" cols="20" rows="20" required placeholder="write here "></textarea>
    <button type="submit" onclick="window.alert('form submit')">submit</button>
    </fieldset>
</form>
</body>
</html>
